    <meta charset="UTF-8" />

    <script>
      // apply the saved theme before first paint so there is never a light/dark flash
      try { var m = localStorage.getItem('fh:mode') || 'System'; var d = m === 'Dark' || (m === 'System' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
